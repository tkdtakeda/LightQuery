<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LightQuery（簡易クエリ）</title>
  <!-- アイコン：Font Awesome Free 7.3.1（CDN・改ざん検知付き） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.3.1/css/all.min.css"
        integrity="sha384-qrALq7+6jBOZIQsNnT6xGkMDru64qD6uTlDra39xrt2SoXl4pO3FX6Roz/RpR/BS" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="lq-tokens.css">
  <link rel="stylesheet" href="lq-base.css">
  <link rel="stylesheet" href="lq-overlays.css">
  <link rel="stylesheet" href="lq-grid.css">
  <link rel="stylesheet" href="lq-panels.css">
  <link rel="stylesheet" href="lq-profiles.css">
  <link rel="stylesheet" href="lq-prep.css">
  <link rel="stylesheet" href="lq-pivot.css">
  <link rel="stylesheet" href="lq-chart.css">
</head>
<body>
  <div class="lq-app">
    <header class="lq-topbar" id="lqTopbar"></header>
    <nav class="lq-rail" id="lqRail" aria-label="設定パネル"></nav>
    <aside class="lq-panel-host" id="lqPanelHost" hidden></aside>
    <main class="lq-main" id="lqMain"></main>
  </div>
  <div class="lq-toasts" id="lqToasts" aria-live="polite"></div>
  <div id="lqPopovers"></div>
  <div id="lqOverlay"></div>

  <!-- 処理（Excel の読み書きに使う SheetJS は lq-readers.js が、グラフの Chart.js は lq-chart-render.js が必要時に CDN から読み込む） -->
  <script src="lq-core.js"></script>
  <script src="lq-readers.js"></script>
  <script src="lq-formula.js"></script>
  <script src="lq-formula-funcs.js"></script>
  <script src="lq-dataset.js"></script>
  <script src="lq-prep.js"></script>
  <script src="lq-engine.js"></script>
  <script src="lq-profiles.js"></script>
  <script src="lq-result.js"></script>
  <script src="lq-result-filter.js"></script>
  <script src="lq-pivot.js"></script>
  <script src="lq-chart-stats.js"></script>
  <script src="lq-chart-types.js"></script>
  <script src="lq-chart-data.js"></script>
  <script src="lq-chart-render.js"></script>
  <script src="lq-chart-forms.js"></script>
  <script src="lq-state.js"></script>
  <script src="lq-exporters.js"></script>
  <script src="lq-storage.js"></script>
  <script src="lq-worksets.js"></script>
  <script src="lq-compare.js"></script>
  <script src="lq-samples.js"></script>
  <!-- 画面 -->
  <script src="lq-ui-kit.js"></script>
  <script src="lq-ui-combo.js"></script>
  <script src="lq-ui-progress.js"></script>
  <script src="lq-ui-grid.js"></script>
  <script src="lq-ui-pivot.js"></script>
  <script src="lq-ui-pivot-panel.js"></script>
  <script src="lq-ui-chart.js"></script>
  <script src="lq-ui-chart-tab.js"></script>
  <script src="lq-ui-chart-panel.js"></script>
  <script src="lq-ui-drill.js"></script>
  <script src="lq-ui-main.js"></script>
  <script src="lq-ui-formula.js"></script>
  <script src="lq-ui-dataset-panel.js"></script>
  <script src="lq-ui-filter.js"></script>
  <script src="lq-ui-result-filter.js"></script>
  <script src="lq-ui-prep.js"></script>
  <script src="lq-ui-review.js"></script>
  <script src="lq-ui-profile-list.js"></script>
  <script src="lq-ui-query-panel.js"></script>
  <script src="lq-ui-output-panel.js"></script>
  <script src="lq-ui-rules-panel.js"></script>
  <script src="lq-ui-dialogs.js"></script>
  <script src="lq-ui-worksets.js"></script>
  <script src="lq-manual.js"></script>
  <script src="lq-ui-shell.js"></script>
  <!-- 操作（出力は lq-app-export.js、前処理は lq-app-prep.js、前回との比較は lq-app-compare.js。組み立ては lq-app.js） -->
  <script src="lq-app-export.js"></script>
  <script src="lq-app-prep.js"></script>
  <script src="lq-app-compare.js"></script>
  <script src="lq-app.js"></script>
</body>
</html>
